# config.yaml
# NutriOpt-Bench 实验配置

# ============================================================
# 算法配置
# ============================================================
algorithms:
  - BMOEA
  - ACMO-Diet
  - MA
  - NSGA2
  - RVEA
  - CTAEA
  - SPEA2

# ============================================================
# E1 Scaling Experiment
# ============================================================
#scales: [500, 1000, 5000, 10000, 50000, 100000, 210000]
scales: [500]
# ============================================================
# E2 Sparsity Experiment
# ============================================================
sparsity_factors: [0.5, 1.0, 1.5]

# ============================================================
# E3 Dimension Experiment
# ============================================================
dimensions: [6, 9, 12, 16]

# ============================================================
# 通用参数
# ============================================================
population_size: 2000
max_generations: 50
max_evaluations: 100000

#targets_total: 30
targets_total: 12
repeats: 10
seed: 42

default_dim: 10
default_sparsity: 1.0

# ============================================================
# 输出配置
# ============================================================
output_dir: results/raw
n_workers: 4