# Profiling config — 1 target × all algos × 1 repeat, tiny budget
experiment: e1_profile
result_class: PROFILE
seed: 42
population_size: 40
max_evaluations: 400
max_generations: 20
early_stop_feasible: null
targets_total: 1
repeats: 1
targets_file: data/representative_targets.csv
algorithms:
  - BMOEA
  - ACMO-Diet
  - MA
  - Random
  - Greedy
  - NSGA2
scales:
  - dataset: nhanes_sample
    size: 1500
    label: "NHANES-1.5K-profile"
output_dir: results/raw
log_dir: results/logs
output_name: e1_profile.csv
