experiment: e0_mechanism
result_class: PRIMARY_E0
seed: 42
population_size: 500
max_evaluations: 100000
max_generations: 10000
early_stop_feasible: null
targets_total: 12
repeats: 10
targets_file: data/representative_targets.csv
# Hardest informative PRIMARY cell (E2 width factor)
sparsity_factors: [0.5]
density_samples: 1000
cap_samples: 600
cap_percentile: 99.0
# Only MOEAD is new; other algorithms reuse results/raw/e2_sparsity_full.csv at f=0.5
algorithms:
  - MOEAD
scales:
  - dataset: nhanes_sample
    size: 10000
    label: "NHANES-10K"
output_dir: results/raw
log_dir: results/logs
output_name: e0_moead_f05.csv
workers: 16
