# config.yaml
# NutriOpt-Bench 实验配置

# ============================================================
# 算法配置
# ============================================================
algorithms:
  - BMOEA
  - ACMO-Diet
  - MA
  - NSGA2
  - RVEA
  - CTAEA
  - SPEA2

# ============================================================
# E1 Scaling Experiment
# ============================================================
scales:
  - dataset: foods_com
    size: 1500
    label: "Foods.com (1.5K)"
  - dataset: allrecipes
    size: 1798
    label: "Allrecipes (1.8K)"
  - dataset: nhanes_full
    size: 210620
    label: "NHANES-210K"
  - dataset: nhanes_sample
    size: 5000
    label: "NHANES-5K"
  - dataset: nhanes_sample
    size: 10000
    label: "NHANES-10K"
  - dataset: nhanes_sample
    size: 50000
    label: "NHANES-50K"
  - dataset: nhanes_sample
    size: 100000
    label: "NHANES-100K"
# ============================================================
# E2 Sparsity Experiment
# ============================================================
sparsity_factors: [0.5, 1.0, 1.5]

# ============================================================
# E3 Dimension Experiment
# ============================================================
dimensions: [6, 9, 12, 16]

# ============================================================
# 通用参数
# ============================================================
population_size: 2000
max_generations: 20
max_evaluations: 100000

#targets_total: 30
targets_total: 2
#repeats: 10
repeats: 1
seed: 42

default_dim: 10
default_sparsity: 1.0

# ============================================================
# 输出配置
# ============================================================
output_dir: results/raw
n_workers: 4