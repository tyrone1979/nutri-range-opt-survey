# E2 primary-lite: scientifically usable multi-seed sparsity study
# Full 100k×10rep remains in e2_full.yaml for final TEVC campaign
experiment: e2_sparsity
result_class: PRIMARY_LITE
seed: 42
population_size: 200
max_evaluations: 20000
max_generations: 500
early_stop_feasible: null
targets_total: 12
repeats: 5
targets_file: data/representative_targets.csv
sparsity_factors: [0.5, 1.0, 1.5]
density_samples: 1000
cap_samples: 600
cap_percentile: 99.0
algorithms:
  - BMOEA
  - ACMO-Diet
  - MA
  - Random
  - Greedy
  - RandomRepair
  - NSGA2
  - RVEA
  - CTAEA
  - SPEA2
scales:
  - dataset: nhanes_sample
    size: 10000
    label: "NHANES-10K"
output_dir: results/raw
log_dir: results/logs
output_name: e2_sparsity_primary_lite.csv
